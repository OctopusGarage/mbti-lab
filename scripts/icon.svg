<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>MBTI Lab — four perspectives</title>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1689f5"/>
      <stop offset="1" stop-color="#004bbb"/>
    </linearGradient>
    <!-- Each lens represents one of the four personality dimensions. -->
    <path id="lens" d="M244 244H174C142 244 120 222 120 190V120H190C222 120 244 142 244 174Z"/>
  </defs>
  <!-- Full bleed: the operating system supplies its own home-screen mask. -->
  <path fill="url(#blue)" d="M0 0H512V512H0Z"/>
  <use href="#lens" fill="#ffffff"/>
  <use href="#lens" transform="rotate(90 256 256)" fill="#bdeaff"/>
  <use href="#lens" transform="rotate(180 256 256)" fill="#ffffff"/>
  <use href="#lens" transform="rotate(270 256 256)" fill="#bdeaff"/>
</svg>
