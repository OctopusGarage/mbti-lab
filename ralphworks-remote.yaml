name: mbti-lab-remote-smoke
task: |
  Add a small MBTI type formatter utility to this repository.
  Create src/utils/formatMbtiType.js exporting formatMbtiType(value).
  Accept strings with optional surrounding whitespace and return the canonical
  uppercase four-letter MBTI type only when each position is valid:
  E/I, N/S, T/F, J/P. Return an empty string for invalid input.
  Add focused Vitest tests for valid and invalid cases. Write a failing test
  before implementation. Keep all other application behavior unchanged.
  Run the configured checks and emit the completion promise only after they pass.
completion_promise: DONE
max_iterations: 3
max_minutes: 10
max_cost_usd: 1
check_timeout_seconds: 180
commit: verified
checks:
  - npm test -- --run
  - npm run build
